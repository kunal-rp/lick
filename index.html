<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: on Android Chrome, the on-screen
         keyboard shrinks the layout viewport (so dvh/% heights reflow above it).
         iOS Safari ignores it — the VisualViewport hook (useAppViewportHeight)
         covers iOS. Zoom is left enabled (no maximum-scale) for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>kunal's scripts</title>
    <!-- Google Identity Services (OAuth) and the gapi loader (Picker API, used
         in a later stage). Loaded via script tags — no npm SDK needed. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
